name: Release Please

# Runs on every push to main. release-please reads the Conventional Commits since
# the last release and keeps a "release PR" open that bumps versionName in
# app/build.gradle.kts and updates CHANGELOG.md. Merging that PR tags the repo
# (vX.Y.Z) and creates a GitHub Release. Nothing is released until you merge it.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The template repository itself has no versions. It never ships an AAB, so a release
    # PR here bumps a `versionName` nothing consumes and then fails the notes gate — which
    # is correct of the gate: it is demanding Play release notes for a version that will
    # never reach Play. A repo *generated* from the template is not itself a template, so
    # this condition is false there and release-please runs normally. Nothing for
    # bootstrap.py to rewrite, and no repository name hardcoded.
    if: github.event.repository.is_template != true
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Config + manifest are auto-detected at the repo root.
          #
          # A PAT, deliberately NOT the built-in GITHUB_TOKEN: GitHub refuses to
          # run workflows on a PR that GITHUB_TOKEN opened (the run lands as
          # "action_required", 0 jobs, awaiting an "Approve and run" click). The
          # "main: require CI" ruleset requires those checks with no bypass
          # actors, so such a PR can never merge. A PAT makes the release PR
          # author a human identity, and CI runs on it like any other PR.
          # Secret: fine-grained PAT, contents + pull-requests write. See
          # docs/RELEASING.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
